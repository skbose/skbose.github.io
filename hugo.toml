baseURL = "https://skbose.github.io/"
languageCode = "en-us"
title = "skbose"
theme = "PaperMod"
paginate = 10

[params]
  env = "production"
  description = "Personal blog"
  defaultTheme = "auto"
  disableThemeToggle = true
  hideFooter = true
  ShowReadingTime = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false

  [params.homeInfoParams]
    Title = "Hi, I'm Sourav 👋"
    Content = "Notes on things I'm building and learning."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/skbose"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 30
